live_trade: true
paper_trade: false
news_disclosure:
  enabled: true
  use_dart: true
  lookback_days: 3
  block_high_risk_disclosures: true
  apply_score_adjustment: true
  hard_block_keywords:
  - 거래정지
  - 상장폐지
  - 관리종목
  - 투자주의환기
  - 감사의견 거절
  - 감사범위 제한
  - 횡령
  - 배임
  - 불성실공시
  - 자본잠식
  - 감자
  negative_keywords:
  - 유상증자
  - 전환사채
  - 신주인수권부사채
  - 적자전환
  - 영업손실
  - 소송
  - 과징금
  - 압수수색
  - 최대주주 변경
  positive_keywords:
  - 단일판매
  - 공급계약
  - 수주
  - 흑자전환
  - 사상 최대
  - 자사주 취득
  - 배당 확대
  - 무상증자
  - 신규 투자
  - 승인
  - 특허
force_trade:
  enabled: true
  description: 예산 범위 내에서 최소 1건 이상 주문 발생을 목표로 하는 거래 보장 모드. 수익 보장이 아니라 주문 발생 보장이다.
  min_orders_per_day: 1
  max_orders_per_day: 20
  force_buy_top_n: 20
  allow_filter_relaxation: true
  relaxation_steps:
  - normal_filters
  - relax_trading_value
  - relax_volatility
  - score_only_with_hard_exclusions
  hard_exclusions:
    exclude_halted_stock: true
    exclude_management_stock: true
    exclude_warning_stock: true
    exclude_preferred_stock: true
    exclude_spac: true
    exclude_etf_etn: true
    min_price: 1000
  minimum_order_amount: 10000
  test_order_amount: 10000
  max_force_trade_budget: 100000
  use_small_test_order_first: true
  cancel_test_order_immediately: false
  allow_real_test_order: true
  allow_real_bulk_order: false
safety:
  confirm_live_trade: true
  require_manual_live_trade_confirmation: true
  allow_real_test_order: true
  max_real_test_order_amount: 100000
  max_real_test_quantity: 1
  block_real_bulk_order: true
  block_real_auto_order_by_default: true
  max_order_retries: 3
  max_api_error_count: 5
  stop_new_orders_on_api_error: true
  allow_market_order: false
  allow_after_hours_order: true
  allow_pre_market_order: true
  allow_next_morning_order: true
real_trade:
  enabled: true
  allow_single_stock_test: true
  allow_bulk_buy: false
  require_single_stock_test_before_bulk: false
  allow_bulk_buy_after_api_confirmation: true
  require_order_plan_for_bulk_buy: true
  require_user_confirm_bulk_buy: true
  max_real_bulk_order_amount: 300000
  block_bulk_if_order_plan_missing: true
  block_bulk_if_readiness_not_ready: true
  block_bulk_if_plan_mismatch: true
  require_final_checkbox: true
  require_order_preview: true
  max_single_test_amount: 100000
  max_single_test_quantity: 1
  allowed_order_type: limit
  allow_market_order: false
  allow_after_hours_real_order: false
  real_order_confirmed_by_user: true
sell_policy:
  default_policy: fixed_2pct
  policies:
    fixed_2pct:
      name: 기본 자동매도
      description: +2% 도달 시 전량 매도, -3% 도달 시 손절
      take_profit_rate: 0.02
      stop_loss_rate: -0.03
      sell_all_at_take_profit: true
      partial_sell_enabled: false
      trailing_enabled: false
      manual_only: false
      force_exit_enabled: true
      force_exit_time: '15:15'
    market_strength_trailing:
      name: 강한 장 트레일링 매도
      description: +2% 도달 후 시장 강도에 따라 일부 익절 및 트레일링 스탑 적용
      take_profit_rate: 0.02
      stop_loss_rate: -0.03
      partial_sell_enabled: true
      first_take_profit_sell_ratio:
        weak: 1.0
        normal: 0.7
        strong: 0.5
        very_strong: 0.0
      trailing_enabled: true
      trailing_start_rate: 0.02
      trailing_stop_rate:
        weak: 0.004
        normal: 0.006
        strong: 0.008
        very_strong: 0.01
      additional_take_profit_rate: 0.035
      additional_take_profit_sell_ratio: 0.3
      force_exit_enabled: true
      force_exit_time: '15:15'
      manual_only: false
    manual_hold:
      name: 수동매도 전까지 보유
      description: 목표가 도달 시 자동매도하지 않고 사용자 직접 매도 전까지 보유
      take_profit_rate: 0.02
      stop_loss_rate: -0.03
      auto_take_profit_enabled: false
      auto_stop_loss_enabled: false
      trailing_enabled: false
      manual_only: true
      force_exit_enabled: false
      show_alerts_only: true
market_strength:
  enabled: true
  kospi_weight: 0.25
  kosdaq_weight: 0.25
  advancer_ratio_weight: 0.25
  top_candidates_positive_ratio_weight: 0.25
  thresholds:
    weak: 0.35
    normal: 0.5
    strong: 0.65
    very_strong: 0.8
trading_hours:
  pre_market_start: 08:30
  pre_market_end: 09:00
  regular_start: 09:00
  regular_end: '15:20'
  closing_auction_start: '15:20'
  closing_auction_end: '15:30'
  after_close_start: '15:30'
  after_close_end: '16:00'
  after_hours_single_start: '16:00'
  after_hours_single_end: '18:00'
after_hours:
  enabled: true
  allow_pre_market: true
  allow_regular: true
  allow_closing_auction: false
  allow_after_close: false
  allow_after_hours_single: true
  pre_market_ord_dvsn_candidates:
  - '05'
  - '60'
  after_close_ord_dvsn_candidates:
  - '06'
  - '62'
  after_hours_single_ord_dvsn_candidates:
  - '61'
  regular_ord_dvsn: '00'
  pre_market_default_ord_dvsn: '05'
  after_close_default_ord_dvsn: '06'
  after_hours_single_default_ord_dvsn: '61'
  real_order_confirmed: false
order_price:
  tick_adjust_enabled: true
  buy_tick_method: floor
  sell_tick_method: ceil
  log_tick_adjustment: true
strategy:
  name: Next Morning 2% Target AI Strategy
  description: +2% 익절 목표 자동매매 전략
  lookback_years: 3
  buy_start_time: '14:40'
  buy_end_time: '15:00'
  after_hours_start_time: '15:40'
  after_hours_end_time: '18:00'
  pre_market_start_time: 08:30
  pre_market_end_time: 08:40
  regular_market_start_time: 09:00
  forced_exit_time_next_day: 09:30
  target_profit_rate: 0.02
  stop_loss_rate: -0.03
  max_holding_days: 1
  prediction_top_n: 50
  buy_top_n: 20
  buy_execution_mode: split_limit
  sell_execution_mode: limit_then_market_if_allowed
  use_equal_weight: true
risk:
  max_positions: 20
  max_position_weight: 0.05
  max_daily_loss_rate: -0.03
  max_market_index_drop_rate: -0.015
  min_price: 1000
  min_daily_trading_value: 3000000000
  min_avg_20d_trading_value: 5000000000
  relaxed_min_daily_trading_value: 500000000
  relaxed_min_avg_20d_trading_value: 1000000000
  exclude_preferred_stock: true
  exclude_spac: true
  exclude_etf_etn: true
  exclude_warning_stock: true
  exclude_halted_stock: true
  exclude_management_stock: true
  use_limit_order_only: true
  emergency_liquidation_enabled: true
kis:
  use_mock: false
  base_url_mock: https://openapivts.koreainvestment.com:29443
  base_url_real: https://openapi.koreainvestment.com:9443
  token_path: /oauth2/tokenP
  app_key_env: KIS_APP_KEY
  app_secret_env: KIS_APP_SECRET
  real_app_key_env: KIS_REAL_APP_KEY
  real_app_secret_env: KIS_REAL_APP_SECRET
  mock_app_key_env: KIS_MOCK_APP_KEY
  mock_app_secret_env: KIS_MOCK_APP_SECRET
  account_no_env: KIS_ACCOUNT_NO
  account_product_code_env: KIS_ACCOUNT_PRODUCT_CODE
  mock_account_no_env: KIS_MOCK_ACCOUNT_NO
  mock_account_product_code_env: KIS_MOCK_ACCOUNT_PRODUCT_CODE
  request_timeout_seconds: 10
  rate_limit_sleep_seconds: 0.25
  token_cache_file: ''
  real_token_cache_file: data/real_token_cache.json
  mock_token_cache_file: data/mock_token_cache.json
order:
  default_order_type: limit
  buy_price_adjustment_rate: 0.001
  sell_price_adjustment_rate: -0.001
  cancel_unfilled_after_seconds: 20
  retry_unfilled_order: true
  max_order_amount_per_stock_rate: 0.05
backtest:
  fee_rate: 0.00015
  tax_rate: 0.0018
  slippage_rate: 0.001
  conservative_entry: true
  conservative_exit: true
  initial_capital: 100000000
model:
  model_type: lightgbm
  fallback_model_type: random_forest
  train_validation_split: time_series
  target_column: target_2pct_next_morning
  primary_metric: precision_at_top20
  random_shuffle: false
  train_ratio: 0.8
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  random_state: 42
data:
  raw_daily_path: data/raw/daily_prices.csv
  raw_intraday_dir: data/intraday
  processed_features_path: data/processed/features.csv
  processed_labels_path: data/processed/labeled_dataset.csv
  positions_file: data/positions.json
  error_log_path: logs/data_collect_errors.log
paths:
  models_dir: models
  model_path: models/model.joblib
  predictions_dir: reports/predictions
  backtests_dir: reports/backtests
  paper_trades_dir: reports/paper_trades
  orders_dir: reports/orders
  logs_dir: logs
logging:
  log_level: INFO
  trade_log_file: logs/trade.log
  api_log_file: logs/api.log
  error_log_file: logs/error.log
sell:
  open_order_check_before_sell: true
  amend_unfilled_on_bulk_sell: true
  cancel_replace_if_amend_fails: true
  aggressive_limit_sell: true
  max_sell_slippage_pct: 1.0
  sell_orders_csv_dir: reports/orders
intraday_filter:
  min_trading_value_krw: 30000000000
  min_change_rate_pct: 1.5
  max_change_rate_pct: 12.0
  min_high_proximity: 0.97
  max_high_drawdown_pct: -3.0
  require_above_vwap: true
  exclude_gap_and_fade: true
  fallback_min_candidates: 10
  score_weights:
    ai_score: 0.30
    trading_value_score: 0.20
    change_rate_score: 0.15
    high_proximity_score: 0.15
    vwap_score: 0.10
    recent_momentum_score: 0.10
