services:
  - type: web
    name: ai-stock
    runtime: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: >-
      streamlit run app/streamlit_app.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --server.enableCORS false
      --server.enableXsrfProtection false
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHONPATH
        value: .
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RENDER
        value: "true"
      # 아래 키들은 Render Dashboard > Environment Variables에서 직접 입력하세요.
      # 절대 이 파일에 실제 값을 커밋하지 마세요.
      # - key: KIS_MOCK_APP_KEY
      # - key: KIS_MOCK_APP_SECRET
      # - key: KIS_MOCK_ACCOUNT_NO
      # - key: KIS_REAL_APP_KEY
      # - key: KIS_REAL_APP_SECRET
      # - key: KIS_ACCOUNT_NO
      # - key: DART_API_KEY
    healthCheckPath: /
    autoDeploy: true
